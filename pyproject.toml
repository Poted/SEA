[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "energy_forecast"
version = "0.1.0"
dependencies = [
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "pydantic-settings>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
